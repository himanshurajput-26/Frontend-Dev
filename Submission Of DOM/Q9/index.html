<!doctype html>
<html><head>
<meta charset="utf-8"><title>Q9 - Form Submit Blocker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Q9 - Form with preventDefault & live errors</h1>
  <div class="card">
    <form id="myForm">
      <div><label>Name: <input id="name" name="name"><span class="err" style="color:red"></span></label></div>
      <div><label>Email: <input id="email" name="email"><span class="err" style="color:red"></span></label></div>
      <div><label>Password: <input id="password" type="password" name="password"><span class="err" style="color:red"></span></label></div>
      <div style="margin-top:8px"><button type="submit">Submit</button></div>
    </form>
    <div id="msg" style="margin-top:12px;color:green"></div>
  </div>
<script src="q9.js"></script>
</body></html>
