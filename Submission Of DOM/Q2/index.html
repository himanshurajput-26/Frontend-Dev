<!doctype html>
<html>

<title>Q2 - Live Character Counter</title>
<link rel="stylesheet" href="style.css">

<body>
  <h1>Q2 - Live Character Counter</h1>
  <div class="card">
    <textarea id="txt" rows="5" cols="50" placeholder="Type (max 100)"></textarea>
    <div>
      <span id="counter">100</span> characters remaining
      <button id="resetBtn">Reset</button>
    </div>
  </div>
<script src="q2.js"></script>
</body>
