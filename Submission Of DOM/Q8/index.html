<!doctype html>
<html><head>
<meta charset="utf-8"><title>Q8 - Custom Dropdown</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Q8 - Custom Dropdown</h1>
  <div class="card">
    <div id="dropdown" style="position:relative;display:inline-block">
      <button id="toggle">Select option</button>
      <div id="options" style="display:none;position:absolute;top:100%;left:0;border:1px solid #ccc;background:#fff">
        <div class="opt">Option 1</div>
        <div class="opt">Option 2</div>
        <div class="opt">Option 3</div>
      </div>
    </div>
  </div>
<script src="q8.js"></script>
</body></html>
